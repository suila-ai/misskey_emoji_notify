[package]
name = "misskey_emoji_notify"
version = "2.0.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
croner = "4.0.2"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg", "webp", "bmp", "tiff", "ico"] }
miapi = { git = "https://github.com/suila-ai/miapi", default-features = false, features = ["v2025.10.0", "streaming"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"
